name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: contest-keeper/.github/.github/workflows/release-please.yml@main

  # Publishes ghcr.io/contest-keeper/ck-hub:<version> and :latest with an SBOM and provenance.
  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: contest-keeper/.github/.github/workflows/release-container.yml@main
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}

  # Production waits for the approval set on the "production" environment of this repository.
  deploy:
    needs: [release-please, image]
    permissions:
      contents: read
      id-token: write
    uses: contest-keeper/ck-hub-setup/.github/workflows/deploy.yml@main
    with:
      environment: production
      image_tag: ${{ needs.image.outputs.image_tag }}
