name: Develop

# Every merge to develop builds the image and deploys it to the develop environment in Azure.

on:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: contest-keeper/.github/.github/workflows/release-container.yml@develop

  deploy:
    needs: image
    permissions:
      contents: read
      id-token: write
    uses: contest-keeper/ck-infra/.github/workflows/deploy.yml@develop
    secrets:
      registry_token: ${{ secrets.GHCR_PULL_TOKEN }}
      cloudflare_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      config_signing_key: ${{ secrets.CK_CONFIG_SIGNING_KEY }}
    with:
      environment: develop
      infra_ref: develop
      image_tag: ${{ needs.image.outputs.image_tag }}
