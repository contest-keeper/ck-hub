version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      github_actions:
        patterns: ["*"]
