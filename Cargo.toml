[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/contest-keeper/ck-hub"
rust-version = "1.89"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# SHA-256 of a 30 GB image is far too slow unoptimized: a debug `image build` took 14 minutes where
# a release build took 1.5. Optimizing just this crate keeps debug builds quick to compile.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

