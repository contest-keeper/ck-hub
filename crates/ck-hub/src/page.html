<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keeper Hub</title>
<style>
  :root {
    --bg: #f3f5f8; --panel: #ffffff; --fg: #14202c; --muted: #596675; --line: #cdd5de;
    --ok: #0b7a6f; --ok-bg: #e3f4f1; --off: #8a3b2e; --off-bg: #f8e6e2;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e151e; --panel: #151f2b; --fg: #e5ecf3; --muted: #93a2b2; --line: #2e3b4a;
      --ok: #3fd0c0; --ok-bg: #0f2e2e; --off: #f0a090; --off-bg: #3a1f1a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-left)); }
  h1 { margin: 0 0 4px; font-size: 24px; }
  #summary { color: var(--muted); margin-bottom: 16px; }
  #problem { display: none; margin-bottom: 12px; padding: 8px 12px; border-radius: 6px; background: var(--off-bg); color: var(--off); }
  .wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; min-width: 980px; }
  th { text-align: left; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; }
  td { padding: 9px 12px; border-top: 1px solid var(--line); white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 1px 9px; border-radius: 10px; font-size: 13px; font-weight: 600; }
  .pill.on { background: var(--ok-bg); color: var(--ok); }
  .pill.off { background: var(--off-bg); color: var(--off); }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .muted { color: var(--muted); }
  td.warn { color: var(--off); font-weight: 600; white-space: normal; min-width: 180px; }
  #login { display: none; max-width: 340px; margin: 40px auto; padding: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  #login h2 { margin: 0 0 12px; font-size: 18px; }
  #login label { display: block; margin: 10px 0 4px; color: var(--muted); font-size: 13px; }
  #login input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
  #login button, #who button { margin-top: 14px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); font: inherit; cursor: pointer; }
  #login-error { color: var(--off); min-height: 1.4em; margin-top: 8px; }
  #who { display: none; float: right; color: var(--muted); font-size: 14px; }
  #who button { margin: 0 0 0 10px; padding: 2px 10px; }
  #empty { display: none; padding: 20px 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div id="who"><span id="who-name"></span><button id="logout" type="button">Log out</button></div>
  <h1>Keeper Hub</h1>
  <form id="login" autocomplete="on">
    <h2>Log in</h2>
    <label for="user">Name</label>
    <input id="user" name="username" autocomplete="username" required>
    <label for="pass">Password</label>
    <input id="pass" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <div id="login-error" role="alert"></div>
  </form>
  <div id="summary">Loading…</div>
  <div id="problem">The Hub cannot be reached. The list below is the last one received.</div>
  <div class="wrap">
    <table>
      <thead><tr>
        <th class="num">#</th><th>Team</th><th>Site</th><th>Contest</th><th>Status</th>
        <th>User</th><th>Last seen</th><th>Computer</th><th class="num">Up</th><th>Recorder</th>
        <th class="num">Heartbeats</th><th>Image</th><th>Warnings</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty">No sticks yet. Make one with ck-forge and it appears here.</div>
  </div>
</main>
<script>
const REFRESH_MS = 5000;

function ago(seconds) {
  if (seconds < 5) return "just now";
  if (seconds < 90) return seconds + " s ago";
  if (seconds < 5400) return Math.round(seconds / 60) + " min ago";
  return Math.round(seconds / 3600) + " h ago";
}

function span(seconds) {
  if (seconds < 90) return seconds + " s";
  if (seconds < 5400) return Math.round(seconds / 60) + " min";
  return (seconds / 3600).toFixed(1) + " h";
}

function cell(row, text, className) {
  const td = document.createElement("td");
  if (className) td.className = className;
  td.textContent = text;
  row.appendChild(td);
  return td;
}

function render(sticks) {
  const body = document.getElementById("rows");
  body.replaceChildren();
  let online = 0;
  for (const stick of sticks) {
    if (stick.online) online += 1;
    const last = stick.last;
    const row = document.createElement("tr");
    cell(row, stick.machine_number ?? "", "num");
    cell(row, stick.team);
    cell(row, stick.site);
    cell(row, stick.contest);
    const status = cell(row, "");
    const pill = document.createElement("span");
    pill.className = "pill " + (stick.online ? "on" : "off");
    pill.textContent = stick.online ? "online" : (last ? "offline" : "not seen yet");
    status.appendChild(pill);
    cell(row, stick.current_user ?? "");
    cell(row, last ? ago(last.seconds_ago) : "", last ? "" : "muted");
    cell(row, last ? last.hostname : "", "mono");
    cell(row, last ? span(last.uptime_s) : "", "num");
    cell(row, last ? last.recorder : "");
    cell(row, last ? String(last.heartbeats) : "", "num");
    cell(row, last ? last.image_version : "", "muted");
    const warning = cell(row, stick.warnings.join(" · "), "warn");
    if (stick.warnings.length) warning.title = stick.warnings.join(String.fromCharCode(10));
    body.appendChild(row);
  }
  document.getElementById("empty").style.display = sticks.length ? "none" : "block";
  document.getElementById("summary").textContent =
    sticks.length + (sticks.length === 1 ? " stick" : " sticks") + " · " + online + " online";
}

function showLogin(visible) {
  document.getElementById("login").style.display = visible ? "block" : "none";
  document.querySelector(".wrap").style.display = visible ? "none" : "block";
  document.getElementById("summary").style.display = visible ? "none" : "block";
  document.getElementById("who").style.display = visible ? "none" : "block";
}

async function refresh() {
  const problem = document.getElementById("problem");
  try {
    const response = await fetch("/api/v1/sticks", { cache: "no-store" });
    if (response.status === 401) { showLogin(true); problem.style.display = "none"; return; }
    if (!response.ok) throw new Error("HTTP " + response.status);
    showLogin(false);
    render(await response.json());
    problem.style.display = "none";
    const me = await fetch("/api/v1/me", { cache: "no-store" });
    if (me.ok) {
      const account = await me.json();
      document.getElementById("who-name").textContent = account.username + " (" + account.role + ")";
    }
  } catch (error) {
    problem.style.display = "block";
  }
}

document.getElementById("login").addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = document.getElementById("login-error");
  message.textContent = "";
  const response = await fetch("/api/v1/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      username: document.getElementById("user").value,
      password: document.getElementById("pass").value,
    }),
  });
  document.getElementById("pass").value = "";
  if (response.ok) { await refresh(); return; }
  try { message.textContent = (await response.json()).error; }
  catch (error) { message.textContent = "Could not log in."; }
});

document.getElementById("logout").addEventListener("click", async () => {
  await fetch("/api/v1/logout", { method: "POST" });
  await refresh();
});

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
