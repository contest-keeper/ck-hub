[package]
name = "ck-hub"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.6.0"
axum = "0.8.9"
base64 = { version = "0.23.1", default-features = false, features = ["alloc", "std"] }
time = { version = "0.3.47", default-features = false, features = ["std", "parsing", "formatting", "macros", "serde-well-known"] }
ck-crypto = { git = "https://github.com/contest-keeper/ck-protocol", rev = "f4796fe7f0546076f1013fb842f85af30dbfb05d", version = "0.1.0" }
ck-protocol = { git = "https://github.com/contest-keeper/ck-protocol", rev = "f4796fe7f0546076f1013fb842f85af30dbfb05d", version = "0.1.0" }
clap = { version = "4.6.7", features = ["derive", "env"] }
hmac = "0.13.0"
postgres = { version = "0.19.14", features = ["with-time-0_3", "with-serde_json-1"] }
rpassword = "7.5.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tokio-postgres-rustls = "0.14.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
webpki-roots = "1.0.12"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
