[package]
name = "ck-hub"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
ck-crypto = { git = "https://github.com/contest-keeper/ck-protocol", rev = "2503ab9fbb3be77089307adb5cbf9ff83469cd13", version = "0.1.0" }
ck-protocol = { git = "https://github.com/contest-keeper/ck-protocol", rev = "2503ab9fbb3be77089307adb5cbf9ff83469cd13", version = "0.1.0" }
clap = { version = "4.6.7", features = ["derive", "env"] }
postgres = { version = "0.19.14", features = ["with-chrono-0_4", "with-serde_json-1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
